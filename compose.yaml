services:
  mysql:
    image: 'mysql:latest'
    container_name: mysql-spmss
    environment:
      - 'MYSQL_DATABASE=spmss_server'
      - 'MYSQL_PASSWORD=secret'
      - 'MYSQL_ROOT_PASSWORD=12345678'
      - 'MYSQL_USER=myuser'
    ports:
      - '3306:3306'
    volumes:
      - ./docker-data/mysql:/var/lib/mysql
